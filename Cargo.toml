[package]
name = "rucerts"
version = "0.1.0"
edition = "2021"
description = "Manage name-constrained cross-certificates for third-party CAs"
publish = false

[features]
# Build OpenSSL from source and link it statically instead of using the system library.
# Windows enables this automatically (see the target section below); elsewhere it is
# opt-in. Building it needs a C compiler, perl and nasm on PATH.
vendored = ["openssl/vendored"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
mimalloc = "0.1"
openssl = "0.10"
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps JSON keys in insertion order rather than sorting them. Chrome
# does not care, but it makes the generated .reg byte-identical to what the previous shell
# implementation produced, so an upgrade can be verified by diffing.
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

# Windows ships no system OpenSSL, so it is always built from source there. Declaring it
# per-target rather than as a flag keeps the feature set identical on every invocation:
# alternating `cargo build` with `cargo build --features vendored` changes the fingerprint
# and forces OpenSSL to rebuild each time.
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# This is a single-binary application, not a published library. Cargo's
# `multiple_crate_versions` fires on transitive duplicates we do not control.
multiple_crate_versions = "allow"

# `#[must_use]` guards against silently discarding a computed value. Nothing here is
# consumed by external callers, and every accessor is used immediately at its one call
# site, so the annotations would be noise rather than protection.
must_use_candidate = "allow"
